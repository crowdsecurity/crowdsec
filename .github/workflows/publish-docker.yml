name: (sub) Publish Docker images

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: docker
      platform:
        required: true
        type: string
      image_version:
        required: true
        type: string
      crowdsec_version:
        required: true
        type: string
      latest:
        required: true
        type: boolean
      push:
        required: true
        type: boolean
      slim:
        required: true
        type: boolean
      debian:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write # push images to ghcr.io

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      created: ${{ steps.matrix.outputs.created }}
    steps:
      - name: Map platforms to runners
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platform }}
        # one job per platform on a native runner: building everything under QEMU on a
        # single host took hours. arm/v6 and arm/v7 still use QEMU if the arm64 host
        # can't run 32-bit code.
        run: |
          matrix=$(jq -cn --arg p "$PLATFORMS" '[
            $p | split(",")[] | gsub("^\\s+|\\s+$"; "") | select(. != "")
            | {platform: ., slug: gsub("/"; "-"),
               runner: (if startswith("linux/arm") then "ubuntu-24.04-arm" else "ubuntu-latest" end)}
          ]')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.environment }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          buildkitd-config: .github/buildkit.toml

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest (slim)
        if: ${{ inputs.slim }}
        id: slim
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./build/docker/Dockerfile${{ inputs.debian && '.debian' || '' }}
          outputs: type=image,"name=${{ secrets.DOCKER_USERNAME }}/crowdsec,ghcr.io/${{ github.repository_owner }}/crowdsec",push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          target: slim
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ inputs.crowdsec_version }}

      - name: Build and push image by digest (full)
        id: full
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./build/docker/Dockerfile${{ inputs.debian && '.debian' || '' }}
          outputs: type=image,"name=${{ secrets.DOCKER_USERNAME }}/crowdsec,ghcr.io/${{ github.repository_owner }}/crowdsec",push-by-digest=true,name-canonical=true,push=${{ inputs.push }}
          target: full
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.created=${{ needs.prepare.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ inputs.crowdsec_version }}

      - name: Export digests
        if: ${{ inputs.push }}
        env:
          SLIM_DIGEST: ${{ steps.slim.outputs.digest }}
          FULL_DIGEST: ${{ steps.full.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests/full"
          touch "${RUNNER_TEMP}/digests/full/${FULL_DIGEST#sha256:}"
          if [[ -n "$SLIM_DIGEST" ]]; then
            mkdir -p "${RUNNER_TEMP}/digests/slim"
            touch "${RUNNER_TEMP}/digests/slim/${SLIM_DIGEST#sha256:}"
          fi

      - name: Upload digests
        if: ${{ inputs.push }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # the flavor keeps alpine and debian apart when both are built in the same run
          name: digests-${{ inputs.debian && 'debian' || 'alpine' }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Push multi-arch manifests
    needs: build
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.debian && 'debian' || 'alpine' }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKERHUB_IMAGE: ${{ secrets.DOCKER_USERNAME }}/crowdsec
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/crowdsec
          VERSION: ${{ inputs.image_version }}
          DEBIAN: ${{ inputs.debian && '-debian' || '' }}
          LATEST: ${{ inputs.latest }}
          SLIM: ${{ inputs.slim }}
        run: |
          # create <target> <version tag suffix> <latest tag>
          create() {
            local target=$1 suffix=$2 latest_tag=$3 image digest
            for image in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
              local args=(-t "${image}:${VERSION}${suffix}")
              if [[ "$LATEST" == true ]]; then
                args+=(-t "${image}:${latest_tag}")
              fi
              for digest in "$target"/*; do
                args+=("${image}@sha256:$(basename "$digest")")
              done
              docker buildx imagetools create "${args[@]}"
              docker buildx imagetools inspect "${image}:${VERSION}${suffix}"
            done
          }
          create full "$DEBIAN" "latest${DEBIAN}"
          if [[ "$SLIM" == true ]]; then
            create slim "-slim${DEBIAN}" "slim${DEBIAN}"
          fi
