$schema: https://json-schema.org/draft/2020-12/schema
title: CrowdSec Kafka datasource
description: >
  Schema for kafka acquisition entries consumed by CrowdSec. Every field
  mirrors pkg/acquisition/modules/kafka.Configuration and the embedded
  configuration.DataSourceCommonCfg.
type: object
additionalProperties: false
properties:
  source:
    type: string
    const: kafka
    description: >
      Must be kafka to bind this acquisition entry to the Kafka datasource.
  mode:
    type: string
    enum: [tail]
    default: tail
    description: >
      Acquisition mode (only tail streaming is supported).
  labels:
    type: object
    minProperties: 1
    description: >
      Labels attached to emitted events (for example type: kafka).
    additionalProperties:
      type: string
    properties:
      type:
        type: string
        description: Parser/collection selector; strongly recommended.
  log_level:
    type: string
    enum: [panic, fatal, error, warn, warning, info, debug, trace]
    description: >
      Overrides the module logger level for this datasource.
  name:
    type: string
    description: Friendly identifier for the datasource entry.
  use_time_machine:
    type: boolean
    default: false
    description: >
      Replays past events when supported by the acquisition module.
  unique_id:
    type: string
    description: >
      Stable identifier injected by cscli/crowdsec auto-run (usually not user set).
  transform:
    type: string
    description: >
      expr program applied to events before they enter the pipeline.
  brokers:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
    description: List of Kafka broker addresses to connect to.
  topic:
    type: string
    minLength: 1
    description: Kafka topic to consume from.
  group_id:
    type: string
    description: >
      Consumer group ID. Mutually exclusive with partition.
  partition:
    type: integer
    description: >
      Explicit non-zero partition to read from. Mutually exclusive with
      group_id (only one may be set to a non-zero/non-empty value).
  timeout:
    type: string
    pattern: "^[0-9]+$"
    description: >
      Dial timeout in seconds (defaults to 10 when unset).
  tls:
    type: object
    additionalProperties: false
    description: TLS settings for the Kafka connection.
    properties:
      insecure_skip_verify:
        type: boolean
        default: false
      client_cert:
        type: string
        minLength: 1
      client_key:
        type: string
        minLength: 1
      ca_cert:
        type: string
        minLength: 1
    required:
      - client_cert
      - client_key
      - ca_cert
  batch:
    type: object
    additionalProperties: false
    description: Batch/consumer tuning passed to the Kafka reader.
    properties:
      min_bytes:
        type: integer
        minimum: 1
      max_bytes:
        type: integer
        minimum: 1
      max_wait:
        type: string
        pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
      queue_size:
        type: integer
        minimum: 1
      commit_interval:
        type: string
        pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
required:
  - source
  - brokers
  - topic
examples:
  - source: kafka
    brokers:
      - localhost:9092
    topic: crowdsec
    group_id: crowdsec-consumers
    labels:
      type: kafka
