$schema: https://json-schema.org/draft/2020-12/schema
title: CrowdSec S3 datasource
description: >
  Schema for s3 acquisition entries consumed by CrowdSec. Every field
  mirrors pkg/acquisition/modules/s3.Configuration and the embedded
  configuration.DataSourceCommonCfg.
type: object
additionalProperties: false
properties:
  source:
    type: string
    const: s3
    description: >
      Must be s3 to bind this acquisition entry to the S3 datasource.
  mode:
    type: string
    enum: [tail, cat]
    default: tail
    description: >
      Acquisition mode (tail polls for new objects, cat performs a finite
      read).
  labels:
    type: object
    minProperties: 1
    description: >
      Labels attached to emitted events (for example type: s3).
    additionalProperties:
      type: string
    properties:
      type:
        type: string
        description: Parser/collection selector; strongly recommended.
  log_level:
    type: string
    enum: [panic, fatal, error, warn, warning, info, debug, trace]
    description: >
      Overrides the module logger level for this datasource.
  name:
    type: string
    description: Friendly identifier for the datasource entry.
  use_time_machine:
    type: boolean
    default: false
    description: >
      Replays past events; strongly recommended for S3 since logs are not
      processed in real time.
  unique_id:
    type: string
    description: >
      Stable identifier injected by cscli/crowdsec auto-run (usually not user set).
  transform:
    type: string
    description: >
      expr program applied to events before they enter the pipeline.
  aws_profile:
    type: string
    description: Named AWS profile to use for credentials.
  aws_region:
    type: string
    default: us-east-1
    description: AWS region to use.
  aws_endpoint:
    type: string
    description: Override the AWS S3/SQS API endpoint (for local testing).
  bucket_name:
    type: string
    description: >
      S3 bucket to poll. Required when polling_method is list; mutually
      exclusive with sqs_name.
  prefix:
    type: string
    description: Restrict listing to keys under this prefix.
  polling_method:
    type: string
    enum: [list, sqs]
    default: list
    description: >
      How new objects are discovered: list (periodic bucket listing) or sqs
      (event notifications via an SQS queue).
  polling_interval:
    type: integer
    minimum: 1
    default: 60
    description: >
      Interval, in seconds, between bucket listings when polling_method is
      list.
  sqs_name:
    type: string
    description: >
      SQS queue name to consume object-created notifications from. Required
      when polling_method is sqs; mutually exclusive with bucket_name.
  sqs_format:
    type: string
    enum: [eventbridge, s3notification, sns]
    description: >
      Expected SQS message envelope format. Auto-detected when omitted.
  max_buffer_size:
    type: integer
    minimum: 1
    description: >
      Maximum size, in bytes, of a scanned line; defaults to bufio's
      MaxScanTokenSize when unset.
required:
  - source
allOf:
  - not:
      required: [bucket_name, sqs_name]
  - if:
      properties:
        polling_method:
          const: sqs
      required: [polling_method]
    then:
      required: [sqs_name]
  - if:
      not:
        properties:
          polling_method:
            const: sqs
        required: [polling_method]
    then:
      required: [bucket_name]
examples:
  - source: s3
    bucket_name: my-waf-logs
    aws_region: eu-west-1
    use_time_machine: true
    labels:
      type: s3
