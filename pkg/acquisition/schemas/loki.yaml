$schema: https://json-schema.org/draft/2020-12/schema
title: CrowdSec Loki datasource
description: >
  Schema for loki acquisition entries consumed by CrowdSec. Every field
  mirrors pkg/acquisition/modules/loki.Configuration and the embedded
  configuration.DataSourceCommonCfg.
type: object
additionalProperties: false
properties:
  source:
    type: string
    const: loki
    description: >
      Must be loki to bind this acquisition entry to the Loki datasource.
  mode:
    type: string
    enum: [tail, cat]
    default: tail
    description: >
      Acquisition mode (tail streams new entries, cat performs a finite
      read).
  labels:
    type: object
    minProperties: 1
    description: >
      Labels attached to emitted events (for example type: loki).
    additionalProperties:
      type: string
    properties:
      type:
        type: string
        description: Parser/collection selector; strongly recommended.
  log_level:
    type: string
    enum: [panic, fatal, error, warn, warning, info, debug, trace]
    description: >
      Overrides the module logger level for this datasource.
  name:
    type: string
    description: Friendly identifier for the datasource entry.
  use_time_machine:
    type: boolean
    default: false
    description: >
      Replays past events when supported by the acquisition module.
  unique_id:
    type: string
    description: >
      Stable identifier injected by cscli/crowdsec auto-run (usually not user set).
  transform:
    type: string
    description: >
      expr program applied to events before they enter the pipeline.
  url:
    type: string
    minLength: 1
    description: Base URL of the Loki server.
  prefix:
    type: string
    default: "/"
    description: >
      Path prefix for the Loki API, normalized to end with a slash.
  query:
    type: string
    minLength: 1
    description: LogQL query used to select streams. Mandatory.
  limit:
    type: integer
    minimum: 1
    default: 100
    description: Maximum number of log lines fetched per request.
  delay_for:
    type: string
    pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
    default: 0s
    description: >
      Delay applied before querying, between 0s and 5s.
  since:
    type: string
    pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
    description: >
      Lower time bound for the query; reset to 0 in tail mode.
  headers:
    type: object
    additionalProperties:
      type: string
    description: Extra HTTP headers sent to Loki.
  wait_for_ready:
    type: string
    pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
    default: 10s
    description: Retry interval while waiting for Loki readiness.
  auth:
    type: object
    additionalProperties: false
    description: Basic auth credentials for Loki.
    properties:
      username:
        type: string
      password:
        type: string
  max_failure_duration:
    type: string
    pattern: "^[0-9]+(ns|us|ms|s|m|h)$"
    default: 30s
    description: >
      Maximum duration of consecutive query failures before the source
      stops.
  no_ready_check:
    type: boolean
    default: false
    description: Bypass the /ready check before starting.
required:
  - source
  - query
examples:
  - source: loki
    url: http://localhost:3100
    query: '{job="varlogs"}'
    labels:
      type: loki
